<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EarthLab Campus</title>
  <script>
    // Old Stream Lab class links (index.html?class=…) now live at stream.html.
    if (new URLSearchParams(location.search).has('class')) location.replace('stream.html' + location.search);
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="platform/platform.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <main id="app" class="pf-app">
    <div id="scene"></div>
    <div id="hud" class="pf-hud"></div>
    <div id="loading" class="pf-loading"><div class="pf-logo">🌍</div><strong>EarthLab</strong><span>Loading campus…</span></div>
  </main>
  <script type="module">
    import { boot } from './platform/host.js';
    boot({ isCampus: true }).catch((e) => {
      console.error(e);
      document.getElementById('loading').innerHTML = '<strong>EarthLab couldn\'t load.</strong><span>Check your internet connection and reload the page.</span>';
    });
  </script>
</body>
</html>
